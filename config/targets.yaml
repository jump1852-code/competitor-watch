      price: { selector: "[itemprop=price]" }
      description: { selector: "p.description" }
      rating: { selector: "p[data-rating]", attr: data-rating }
      reviews: { selector: "[itemprop=reviewCount]" }
      image: { selector: "img", attr: src }
