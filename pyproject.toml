[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-watch"
version = "1.0.0"
description = "Config-driven product & price monitoring with change detection and a static dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Passakorn Pongsangiam", email = "jumpbcc@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-requests", "types-PyYAML"]

[project.scripts]
competitor-watch = "competitor_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
