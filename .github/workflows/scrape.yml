name: Daily scrape & deploy dashboard

on:
  schedule:
    - cron: "17 1 * * *" # 01:17 UTC = 08:17 Bangkok, every day
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: space-separated target ids to scrape"
        required: false
  push:
    branches: [main]
    paths: ["site/**", "src/**", "config/**"]

permissions:
  contents: write # commit the updated data/ history back to the repo
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: scrape-and-pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Scrape targets & detect changes
        if: github.event_name != 'push'
        run: competitor-watch run ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Build dashboard data
        run: competitor-watch build

      - name: Commit updated history
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
